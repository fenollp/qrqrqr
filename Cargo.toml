[package]
name = "qrqrqr"
version = "0.1.0"
edition = "2021"
description = "Offline QR code decoder (Rust -> WebAssembly) for the qrqrqr Firefox extension"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rqrr = "0.11"
wasm-bindgen = "=0.2.100"

[dev-dependencies]
qrcode = { version = "0.14", default-features = false }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
