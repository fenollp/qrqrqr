name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.100

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: make test

      - run: make wasm

      - run: make smoke

      - run: make lint

      - run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: qrqrqr-unsigned
          path: dist/*.zip
